[project]
name = "condoos-api"
version = "0.1.0"
description = "CondoOS — agente auditor de despesas de condomínios (API e worker)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "boto3>=1.35",
    "aiosmtplib>=3.0",
    "httpx>=0.28",
    "anthropic>=2.5.0",
    "python-multipart>=0.0.33",
    "pypdfium2>=5.14.0",
    "pillow>=13.0.0",
    "defusedxml>=0.7.1",
    "reportlab>=5.1.0",
]

[project.optional-dependencies]
# Worker only: PDF/image -> structured text with OCR (MIT). Pulls CPU-only torch.
docling = ["docling>=2.147", "torch>=2.6", "torchvision>=0.21"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8",
    "black>=24.10",
    "boto3-stubs[s3]>=1.35",
    "types-defusedxml>=0.7.0.20260504",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "ASYNC"]
ignore = ["E501", "S101", "B008", "RUF001", "RUF002", "RUF003", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "ASYNC240"]
"app/seed/**" = ["S311"]
"corpus/**" = ["S311", "T201"]
"app/db/migrations/**" = ["E501", "N999", "S608"]  # DDL built from our own settings

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["app/db/migrations/"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "aiosmtplib.*", "pypdfium2.*", "docling.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]
pythonpath = ["."]
markers = [
    "slow: testes lentos (avaliação do chat, LLM real)",
]
addopts = "-m 'not slow'"
