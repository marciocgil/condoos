# Production on one VPS (Hostinger, São Paulo): docs/deploy.md, section 9.
#   docker compose -f docker-compose.prod.yml --env-file deploy/.env.production up -d --build
# Differences from docker-compose.yml: no Mailpit, no SeaweedFS (documents in AWS S3 São
# Paulo), PostgreSQL not exposed, Caddy in front with automatic HTTPS, no seed.
name: condoos

# Container logs rotate (Docker keeps them forever by default and fills the disk).
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-api-env: &api-env
  ENVIRONMENT: production
  DATABASE_URL: postgresql+asyncpg://condoos_app:${DB_APP_PASSWORD:?}@postgres:5432/condoos
  DATABASE_WORKER_URL: postgresql+asyncpg://condoos_worker:${DB_WORKER_PASSWORD:?}@postgres:5432/condoos
  DATABASE_ADMIN_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/condoos
  WEB_BASE_URL: https://${APP_DOMAIN:?}
  SESSION_COOKIE_SECURE: "true"
  MAILER: smtp
  SMTP_HOST: ${SMTP_HOST:?}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:?}
  SMTP_PASSWORD: ${SMTP_PASSWORD:?}
  MAIL_FROM: ${MAIL_FROM:?}
  S3_ENDPOINT_URL: https://s3.sa-east-1.amazonaws.com
  S3_PUBLIC_ENDPOINT_URL: https://s3.sa-east-1.amazonaws.com
  S3_REGION: sa-east-1
  S3_BUCKET: ${S3_BUCKET:?}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
  INGEST_EMAIL_DOMAIN: ${INGEST_EMAIL_DOMAIN:?}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  CLAUDE_MODEL_EXTRACTION: ${CLAUDE_MODEL_EXTRACTION:-claude-sonnet-5-5}
  CLAUDE_MODEL_REASONING: ${CLAUDE_MODEL_REASONING:-claude-opus-5-5}
  CLAUDE_MODEL_FAST: ${CLAUDE_MODEL_FAST:-claude-haiku-5-5}
  LLM_MONTHLY_BUDGET_USD_PER_CONDOMINIUM: ${LLM_MONTHLY_BUDGET_USD_PER_CONDOMINIUM:-40}
  CHAT_MAX_TURNS: ${CHAT_MAX_TURNS:-8}
  CHAT_MAX_BUDGET_USD: ${CHAT_MAX_BUDGET_USD:-0.50}
  EMBEDDINGS_ENABLED: "true"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: condoos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d condoos"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build: ./api
    command: api
    restart: unless-stopped
    logging: *logging
    environment:
      <<: *api-env
      SEED_ON_START: "false"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30

  worker:
    build:
      context: ./api
      args:
        INSTALL_DOCLING: "true"
    command: worker
    restart: unless-stopped
    logging: *logging
    environment:
      <<: *api-env
      DOCUMENT_CONVERTER: auto
      HF_HUB_OFFLINE: "1"
      INBOUND_EMAIL_PROVIDER: s3
      INBOUND_EMAIL_S3_BUCKET: ${INBOUND_EMAIL_S3_BUCKET:?}
      INBOUND_EMAIL_S3_REGION: sa-east-1
      INBOUND_EMAIL_S3_ACCESS_KEY_ID: ${INBOUND_EMAIL_S3_ACCESS_KEY_ID:?}
      INBOUND_EMAIL_S3_SECRET_ACCESS_KEY: ${INBOUND_EMAIL_S3_SECRET_ACCESS_KEY:?}
    depends_on:
      api: { condition: service_healthy }

  web:
    build:
      context: ./web
      args:
        API_INTERNAL_URL: http://api:8000
    restart: unless-stopped
    logging: *logging
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    logging: *logging
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
