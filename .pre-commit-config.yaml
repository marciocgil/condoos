# Local hooks only (no downloads): they call the tools installed by `make install`.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: bash -c 'cd api && uv run ruff check app tests'
        language: system
        files: ^api/.*\.py$
        pass_filenames: false
      - id: black
        name: black
        entry: bash -c 'cd api && uv run black --check app tests'
        language: system
        files: ^api/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: bash -c 'cd api && uv run mypy app tests'
        language: system
        files: ^api/.*\.py$
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: bash -c 'cd web && npm run -s lint'
        language: system
        files: ^web/.*\.(ts|tsx|mjs)$
        pass_filenames: false
      - id: tsc
        name: tsc (strict)
        entry: bash -c 'cd web && npm run -s typecheck'
        language: system
        files: ^web/.*\.(ts|tsx)$
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: bash -c 'cd web && npm run -s format:check'
        language: system
        files: ^web/
        pass_filenames: false
      - id: no-env-file
        name: never commit .env
        entry: bash -c 'echo ".env must not be committed" && exit 1'
        language: system
        files: (^|/)\.env$
